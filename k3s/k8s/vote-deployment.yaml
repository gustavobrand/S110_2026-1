apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  namespace: voteapp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # cria 1 pod novo antes de remover antigo
      maxUnavailable: 0  # zero pods indisponíveis durante o update
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - name: vote
        image: voteapp-vote:v1   # imagem com tag explícita
        # image: dockersamples/examplevotingapp_vote
        ports:
        - containerPort: 80
        readinessProbe:         # k8s só roteia tráfego quando pronto
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "300m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  namespace: voteapp
spec:
  # type: NodePort
  type: ClusterIP
  selector:
    app: vote
  ports:
  - port: 80
    targetPort: 80
    # nodePort: 30000    # mapeado para localhost:8080 no k3d
